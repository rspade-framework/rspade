; Full-page cache proxy. nginx hands every non-static request here; on a cache
; miss it calls back into nginx's loopback server block on :3201.
[program:fpc-proxy]
command=bash /usr/local/bin/rspade-retry-run fpc-proxy /usr/bin/node /var/www/html/system/bin/fpc-proxy.js
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=10
stopwaitsecs=10
priority=40
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
