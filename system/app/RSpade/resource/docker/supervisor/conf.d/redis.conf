; Redis: cache, realtime message delivery, and short-lived counters.
; Started EARLY (low priority number) - the application expects it to answer.
[program:redis]
command=bash /usr/local/bin/rspade-retry-run redis /usr/bin/redis-server /etc/redis/redis.conf
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
startretries=999999
priority=10
stopsignal=QUIT
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
