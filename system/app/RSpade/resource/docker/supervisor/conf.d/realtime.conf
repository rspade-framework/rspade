; The realtime WebSocket relay. nginx proxies /ws to it.
;
; Runs through realtime-run.sh rather than node directly: on a checkout whose
; framework predates the realtime feature the relay script may not exist yet,
; and `node <missing file>` would exit instantly and drive this program into a
; FATAL crash loop. The runner idles until the file appears, then execs node in
; place, so supervisor manages the relay normally from then on.
[program:realtime]
command=bash /usr/local/bin/rspade-retry-run realtime bash /usr/local/bin/rspade-realtime-run
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=5
stopwaitsecs=10
priority=40
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
