; MySQL - DEVELOPMENT TARGET ONLY. The production image does not ship this file;
; production connects to a database server you provide.
;
; Started first (priority 5): migrations, the application, and the task worker
; all expect it.
;
; DELIBERATELY NOT WRAPPED in the retry runner that every other service uses.
; Those services wait for the APPLICATION to become ready; MySQL is what they
; wait FOR, so it has nothing to wait on itself - and `migrate` STOPS this
; program on purpose to snapshot the data directory. A wrapper that restarts it
; on exit could bring mysqld back up mid-copy, which is datadir corruption, and
; this framework has been bitten by exactly that before. supervisor's own
; autorestart covers a genuine crash; startretries is raised so a slow first
; start is never given up on.
;
; NOTE FOR THE CURIOUS: `migrate` in development mode snapshots the datadir
; before running, which it does by stopping THIS program, copying
; /var/lib/mysql, and starting it again. That is why MySQL must be a supervised
; program inside the same container as PHP, and why splitting it into its own
; compose service would break migration rollback.
[program:mysql]
command=/usr/sbin/mysqld --user=root --innodb-use-native-aio=0
autostart=true
autorestart=true
startretries=999999
priority=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
