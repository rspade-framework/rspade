; The cluster lock daemon. Application locks are granted here.
;
; LOAD-BEARING: code that takes a lock against an address nothing is listening
; on waits with no deadline and no error - the least diagnosable failure shape
; there is. Started early, before php-fpm.
[program:rsx-lockd]
command=bash /usr/local/bin/rspade-retry-run rsx-lockd bash /var/www/html/system/bin/rsx-lockd/lockd-run.sh
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=5
stopwaitsecs=10
priority=15
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
