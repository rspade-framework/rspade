; Background work: scheduled tasks (#[Schedule]) and everything dispatched with
; Task::dispatch().
;
; THIS IS THE CRON REPLACEMENT. The framework's documented driver is the single
; crontab line
;
;     * * * * * php artisan rsx:task:process
;
; and without it NO background or scheduled work runs at all - silently, because
; dispatching a task succeeds whether or not anything ever processes it. A
; container has no crontab, so the loop lives here instead: same once-a-minute
; cadence, but visible in `supervisorctl status` and logging to the container
; log like every other service.
;
; Full rationale, and the cadence knob, live in the runner script.
[program:tasks]
command=bash /usr/local/bin/rspade-retry-run tasks bash /usr/local/bin/rspade-task-run
directory=/var/www/html
autostart=true
autorestart=true
startretries=999999
startsecs=5
stopwaitsecs=30
priority=50
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
