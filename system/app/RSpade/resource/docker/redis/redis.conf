# /etc/redis/redis.conf

# Basic configuration
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Unix socket for better performance
unixsocket /var/run/redis/redis.sock
unixsocketperm 777

# Database configuration
databases 16

# Memory management
# 128MB total for caching (Database 0)
maxmemory 128mb

# LRU eviction policy for cache database (0)
# This applies ONLY to database 0 with our selective eviction setup
maxmemory-policy allkeys-lru

# Persistence disabled for performance (cache + locks are ephemeral)
save ""
appendonly no

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

# Performance tuning
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client management
maxclients 10000

# Keyspace notifications (for lock expiration monitoring)
notify-keyspace-events Ex

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_rspade_internal"

# AOF settings (disabled)
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Lua scripting
lua-time-limit 5000

# Latency monitoring
latency-monitor-threshold 0

# Event notification
notify-keyspace-events ""

# Advanced config
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
aof-rewrite-incremental-fsync yes