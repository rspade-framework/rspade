; OPcache - PRODUCTION
;
; Timestamps are still validated, but at most once every 10 seconds per file
; rather than on every request. Compiled bytecode is reused in between, which is
; the single largest PHP performance difference between a development and a
; production box.
;
; WHAT THIS MEANS WHEN YOU DEPLOY: newly deployed code becomes live within ~10
; seconds by itself. No restart is required. If you want it immediate, reload
; php-fpm:
;
;     supervisorctl restart php-fpm
;
; (validate_timestamps=0 would be faster still, but then deployed code is NEVER
; picked up without a restart - a failure mode that looks like "the deploy did
; nothing" and costs more than it saves. 10 seconds is the deliberate middle.)

zend_extension=opcache.so

opcache.enable=1
opcache.enable_cli=0
opcache.jit=off

opcache.validate_timestamps=1
opcache.revalidate_freq=10

opcache.memory_consumption=256
opcache.max_accelerated_files=30000
opcache.interned_strings_buffer=24
