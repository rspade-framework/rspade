; PRODUCTION overrides for the Ajax pool. See ajax.conf for WHY this pool exists
; at all (it is an SSR deadlock fix, not tuning) and www-prod.conf for why
; production runs as www-data with a dynamic worker pool.
;
; Keep this pool sized in proportion to the main one. Starving it re-creates the
; exact deadlock the split exists to prevent.

[ajax]
user = www-data
group = www-data

listen = /run/php/php-fpm-ajax.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

catch_workers_output = yes
decorate_workers_output = no
