; PRODUCTION overrides for the main pool.
;
; Two differences from the development pool, both consequences of the code being
; DEPLOYED rather than bind-mounted from somebody's laptop:
;
;   1. It runs as www-data. There is no host developer whose file ownership we
;      would be fighting, so the application has no business running as root.
;      The entrypoint gives www-data ownership of storage/ before starting.
;
;   2. pm = dynamic with a real worker count. `ondemand` spends a fork on the
;      first request of every idle period, which is invisible in development and
;      is a latency floor in production.
;
; SIZE THIS FOR YOUR BOX. max_children is the ceiling on concurrent PHP
; requests, and each worker is real memory - roughly (available RAM / average
; process size). The defaults below suit a small instance and are meant to be
; edited, not inherited unexamined.

[www]
user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

catch_workers_output = yes
decorate_workers_output = no
