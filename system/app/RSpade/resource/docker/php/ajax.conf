; A SECOND PHP-FPM pool, serving only /_ajax/.
;
; This is not tuning - it is a deadlock fix, and the two pools must stay
; separate. Server-side rendering issues an internal HTTP request back into the
; application while the originating worker is still occupied waiting for it. On
; a single pool, a burst of those can occupy every worker with requests that are
; each waiting on a worker that does not exist. Nothing errors; the site simply
; stops answering.
;
; Giving Ajax its own pool means the callback always has somewhere to land.

[ajax]
user = root
group = root

listen = /run/php/php-fpm-ajax.sock
listen.owner = root
listen.group = root

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
