; The main PHP-FPM pool - every ordinary web request.
;
; RUNS AS ROOT, deliberately, and only because this is a container: root inside
; a container is not root on the host, and the application tree is a bind mount
; from the developer's machine whose ownership we cannot predict. Running as
; www-data would mean every file the application writes is owned by uid 33,
; which on a Linux host the developer then cannot edit without sudo.
;
; The predecessor to this arrangement solved that with `chmod -R 777` plus a
; permanent inotify watcher re-applying it to every new file. That is gone: a
; world-writable application tree is a worse answer than an explained root.
;
; A production deployment does not have the bind-mount problem - the code is
; deployed, not mounted - so prod overrides this pool to run as www-data. See
; www-prod.conf.

[www]
user = root
group = root

listen = /run/php/php-fpm.sock
listen.owner = root
listen.group = root

; ondemand: workers start when a request arrives and retire when idle. Right for
; a development container that spends most of its life doing nothing.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Surface fatals in the container log rather than swallowing them.
catch_workers_output = yes
decorate_workers_output = no
