; OPcache - DEVELOPMENT
;
; validate_timestamps with revalidate_freq=0 means PHP re-checks a file's mtime
; on every request and recompiles the moment it changes. That is what makes the
; framework's promise true: edit a file, refresh the browser, see the change,
; with no build step and no service restart.
;
; It costs a stat() per included file per request. On a development box that is
; the correct trade; see opcache-prod.ini for the other side of it.

zend_extension=opcache.so

opcache.enable=1
opcache.enable_cli=0
opcache.jit=off

opcache.validate_timestamps=1
opcache.revalidate_freq=0

opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
