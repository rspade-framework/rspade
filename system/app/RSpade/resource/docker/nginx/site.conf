# =============================================================================
# RSpade site configuration - three server blocks.
#
#   :80    plain http. The development default: a local container with nothing
#          terminating TLS in front of it. APP_URL must name the published port
#          (http://localhost:8080), because the browser's authority is what
#          generated URLs have to match.
#
#   :8000  the same site, asserting https to the application (X-Forwarded-Proto
#          and HTTPS=on). Publish THIS one when a reverse proxy or load balancer
#          terminates TLS ahead of the container - it is what makes the session
#          cookie Secure and every generated URL https.
#
#   :3201  loopback only. The full-page cache proxy (fpc-proxy.js, port 3200)
#          calls back here on a cache miss. Never publish it.
#
# EVERY proxy_set_header uses $http_host, never $host: nginx's $host STRIPS the
# port, so a container published on :8080 would hand the browser a realtime
# WebSocket URL and a Content-Security-Policy pointing at :80, and the socket
# would never connect. $http_host is the authority exactly as the browser sent
# it. (Rsx::get_http_host() is the application-side half of the same rule.)
# =============================================================================

# ---- :80 - plain http ----
server {
        listen 80 default_server;
        listen [::]:80 default_server;

        root /var/www/html/system/public;

        index index.html index.php;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        server_name _;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
            proxy_pass http://localhost:6200;
        }

        location /_build/ {
            proxy_pass http://localhost:3100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location /_build/ws {
            proxy_pass http://localhost:3101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Ajax requests use separate FPM pool (prevents SSR callback deadlock)
        location /_ajax/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_pass unix:/run/php/php-fpm-ajax.sock;
        }

        location / {
                try_files $uri $uri/ @fpc_proxy;
        }

        location @fpc_proxy {
            proxy_pass http://127.0.0.1:3200;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        location ~ \.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }


}

server {
        listen 8000 default_server;
        listen [::]:8000 default_server;

        root /var/www/html/system/public;

        index index.html index.php;
        autoindex off;
        charset UTF-8;
        client_max_body_size 500M;

        add_header X-Forwarded-Proto https;

        server_name _;

        location /ws {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_read_timeout 86400;
            proxy_pass http://localhost:6200;
        }

        location /_build/ {
            proxy_pass http://localhost:3100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 86400;
        }

        location /_build/ws {
            proxy_pass http://localhost:3101;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }

        # Ajax requests use separate FPM pool (prevents SSR callback deadlock)
        location /_ajax/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS 'on';
            fastcgi_pass unix:/run/php/php-fpm-ajax.sock;
        }

        location / {
                try_files $uri $uri/ @fpc_proxy;
        }

        location @fpc_proxy {
            proxy_pass http://127.0.0.1:3200;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
        }

        location ~ \.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
                fastcgi_param  HTTPS 'on';
                fastcgi_pass unix:/run/php/php-fpm.sock;
        }

        location ~* (\.php$|\.htaccess$|\.git) {
                deny all;
        }


}

# FPC backend server - accessed by fpc-proxy.js for cache misses
server {
    listen 127.0.0.1:3201;

    root /var/www/html/system/public;

    index index.html index.php;
    autoindex off;
    charset UTF-8;
    client_max_body_size 500M;

    # Ajax requests use separate FPM pool (prevents SSR callback deadlock)
    location /_ajax/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php-fpm-ajax.sock;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location ~* (\.php$|\.htaccess$|\.git) {
        deny all;
    }
}
