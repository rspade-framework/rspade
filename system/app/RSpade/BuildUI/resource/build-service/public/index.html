<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSpade Asset Compiler</title>
    <link rel="stylesheet" href="/_build/node_modules/xterm/css/xterm.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1.5rem 2rem;
            background: #252526;
            border-bottom: 1px solid #3e3e42;
        }

        .header h1 {
            margin: 0;
            color: #4ec9b0;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .terminal-container {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #terminal {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 0.5rem;
            overflow: hidden;
        }

        /* xterm.js overrides for better appearance */
        .xterm {
            height: 100% !important;
        }

        .xterm-viewport {
            background: transparent !important;
        }

        .xterm-screen {
            background: transparent !important;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>RSpade Asset Compiler</h1>
    </div>

    <div class="terminal-container">
        <div id="terminal"></div>
    </div>

    <script src="/_build/dist/bundle.js"></script>
</body>
</html>
